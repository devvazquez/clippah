[project]
name = "clipper-backend"
version = "0.1.0"
description = "Detector automatico de momentos destacados en VODs de Twitch y YouTube"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "yt-dlp>=2024.8.6",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0.3"]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = [
    "B008",      # Depends()/Query() en defaults es el idioma de FastAPI
    "SIM105",    # try/except/pass explicito se lee mejor que suppress en sitios puntuales
    "ASYNC109",  # timeout propio en los wrappers de subprocess: se pasa a wait_for
    "ASYNC240",  # stat()/unlink() sobre ficheros locales: no merece un backend async de FS
]

[tool.ruff.lint.per-file-ignores]
"**/db.py" = ["E501"]                 # el esquema SQL se lee mejor alineado
"**/providers/gemini.py" = ["E501"]   # el prompt va literal, sin reflow
